<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a8413d">
  <meta name="description" content="La feuille de belote, tout simplement. Vos scores, même hors connexion.">
  <title>SCORE — La feuille de belote</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body data-theme="bistrot">
  <main class="sheet" aria-label="Feuille de score de belote">
    <header class="sheet-top">
      <div class="brand">SCORE<span>la feuille de belote</span></div>
      <div class="tools">
        <button id="undo" class="icon-button" aria-label="Annuler la dernière donne" title="Annuler la dernière donne">↶</button>
        <button id="menu" class="icon-button" aria-label="Ouvrir le menu" title="Menu">☰</button>
      </div>
    </header>
    <section class="score-head" aria-label="Totaux cumulés">
      <div><h1>NOUS</h1><strong id="total-nous">0</strong></div>
      <div><h1>VOUS</h1><strong id="total-vous">0</strong></div>
    </section>
    <div id="result" class="result" role="status" hidden></div>
    <section id="rounds" class="rounds" aria-label="Les donnes"></section>
    <p id="hint" class="hint">Touchez un ovale pour noter les points.</p>
    <div class="paper-end" aria-hidden="true">♥</div>
  </main>
  <dialog id="entry-dialog" class="entry-dialog" aria-labelledby="entry-title">
    <div class="dialog-heading"><h2 id="entry-title">Points de NOUS</h2><button class="close" data-close aria-label="Fermer">×</button></div>
    <div class="entry-display"><output id="entry-value" aria-live="polite">0</output><span>points de plis</span></div>
    <label class="belote"><input id="belote" type="checkbox"> <span>+ Belote / Rebelote <small>20 points</small></span></label>
    <p id="entry-preview" class="entry-preview" aria-live="polite"></p>
    <div class="keypad" aria-label="Clavier numérique">
      <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button>
      <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button>
      <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button>
      <button id="clear" class="key-action" aria-label="Effacer toute la saisie">C</button><button data-digit="0">0</button><button id="backspace" class="key-action" aria-label="Effacer le dernier chiffre">⌫</button>
    </div>
    <button id="enter" class="primary">Entrer</button>
  </dialog>
  <dialog id="menu-dialog" aria-labelledby="menu-title">
    <div class="dialog-heading"><h2 id="menu-title">Au coin de la table</h2><button class="close" data-close aria-label="Fermer">×</button></div>
    <nav class="menu-list" aria-label="Actions de la partie">
      <button id="new-game">Nouvelle partie <span>Une feuille toute neuve</span></button>
      <button id="themes">Changer d’ambiance <span>À chaque table son style</span></button>
      <button id="save-game">Enregistrer la partie <span>Garder un bon souvenir</span></button>
      <button id="saved-games">Parties enregistrées <span>Retrouver les belles parties</span></button>
    </nav>
  </dialog>
  <dialog id="panel-dialog" aria-labelledby="panel-title">
    <div class="dialog-heading"><h2 id="panel-title"></h2><button class="close" data-close aria-label="Fermer">×</button></div>
    <div id="panel-content"></div>
  </dialog>
  <p id="toast" class="toast" role="status" hidden></p>
</body>
</html>
